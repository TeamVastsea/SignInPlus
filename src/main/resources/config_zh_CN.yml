######################################################### 
# SignInPlus 插件配置文件 (默认示例) 
# 说明: 本文件包含所有可配置选项与默认示例 
# 注意: 修改后请使用 /signinplus reload 重载配置 
# 若需使用中文版配置，请删除英文版 config.yml 并将本文件重命名为 config.yml
######################################################### 

#########################################################
# 数据存储配置
# 说明
# - 可选: sqlite / mysql / postgresql
# - 键名: database.type / database.url / database.username / database.password
# URL 格式
# - sqlite: signinplus.db
# - postgresql: db.example.com:5432/signinplus?sslmode=verify-full
# - mysql: db.example.com:3306/signinplus?sslMode=VERIFY_IDENTITY
# 数据库必须预先创建，建议使用仅拥有该数据库权限的最小权限账户。
# 用户名和密码也可通过 SIGNINPLUS_DB_USERNAME / SIGNINPLUS_DB_PASSWORD 提供。
# 示例
# - postgresql: type=postgresql, url=127.0.0.1:5432/signinplus?sslmode=disable, username=local_pg, password=...
#########################################################
database:
  type: sqlite
  url: signinplus.db
  username: 
  password:
  pool_size: 10
  connection_timeout_ms: 10000

######################################################### 
# 登录时操作配置 
# 说明: 玩家登录时执行的操作 
# 选项: signin / open_gui / none
######################################################### 
on_login_action: none 

#########################################################
# 插件基础配置
# message_prefix: 插件消息前缀
# timezone: 详情可见 https://www.zeitverschiebung.net/cn/all-time-zones.html
# locale: 多语言配置 (zh_CN / en_US)
# debug: 是否启用调试模式 (输出更多日志)
#########################################################
message_prefix: "&7[&aSignInPlus&7] "
timezone: "Asia/Shanghai"
locale: zh_CN
debug: false

# 玩家数据始终以 UUID 为身份键。使用 UniversalAuth/Velocity 时可开启此项，拒绝因转发配置错误
# 而产生的“由玩家名计算出的离线 UUID”。
identity:
  require_stable_uuid: false

######################################################### 
# 默认签到奖励 
# 玩家签到后触发的动作，支持多种动作类型： 
# - [COMMAND]   执行指令 (支持占位符 %player_name%) 
# - [SOUND]     播放音效 [种类 音量 pitch] 
# - [ITEM]      给予物品 [物品 数量 /give 数据组件]
#                 示例：diamond_sword 1 [minecraft:enchantments={levels:{"minecraft:sharpness":3}}]
# - [SLEEP]     延迟 (单位: ticks, 20ticks = 1s) 
# - [EFFECT]    添加状态效果 [种类 等级 时间(秒)] 
# - [MESSAGE]   发送消息 [消息] 
# - [TITLE]     发送标题 [文字] 
# - [BROADCAST] 广播消息 [消息] 
# - [POINTS]    给予积分 [数量 格式] 
# 
# 概率触发： 
# - [PROB=X]    按概率触发 [概率] 
# - [RANDOM_WEIGHTED] 起始权重列表块 
# - [WEIGHT=X]  按权重触发 [权重] 
# - [/RANDOM_WEIGHTED] 结束权重列表块 
# - [RANDOM_PICK=X] 起始随机互斥抽取列表块 
# - [/RANDOM_PICK] 结束随机互斥抽取列表块 
######################################################### 
default: 
  # 生产安全默认值：管理员显式配置前不发放会改变经济系统的奖励。
  actions: []
  # 示例：
  # actions:
  #   - "[COMMAND] give %player_name% apple 1"
  #   - "[POINTS] 1.00"
  #   - "[PROB=0.10] [COMMAND] give %player_name% diamond 1"

######################################################### 
# 累计签到、连续奖励 
# - enable: 是否启用 
# - times: 次数 
######################################################### 
cumulative: 
  - enable: false 
  - times: 7 
    actions: 
      - "[COMMAND] give %player_name% iron_ingot 10" 
      - "[MESSAGE] 恭喜你累计签到7天，获得10个铁锭！" 
  - times: 30 
    actions: 
      - "[COMMAND] give %player_name% diamond 2" 
      - "[TITLE] 累计签到30天|奖励钻石x2" 
  - times: 100 
    actions: 
      - "[COMMAND] give %player_name% nether_star 1" 
      - "[BROADCAST] %player_name% 累计签到100天，获得传说奖励！" 
streak: 
  - enable: false 
  - times: 3 
    actions: 
      - "[COMMAND] give %player_name% apple 5" 
      - "[MESSAGE] 连续签到3天，送你5个苹果！" 
  - times: 7 
    actions: 
      - "[COMMAND] give %player_name% golden_apple 1" 
      - "[MESSAGE] 连续签到7天，奖励金苹果1个！" 

######################################################### 
# 排行奖励 (额外奖励，不会替代默认奖励) 
# 根据当天签到排名发放额外奖励 
# - enable: 是否启用 
# - rank: 排名 
######################################################### 
top: 
  - enable: false 
  - rank: 1 
    actions: 
      - "[COMMAND] give %player_name% apple 64" 
  - rank: 2 
    actions: 
      - '[COMMAND] give %player_name% diamond_sword 1' 
  - rank: 3 
    actions: 
      - "[COMMAND] give %player_name% emerald 64" 

######################################################### 
# 特殊日期签到奖励 
# - 支持指定日期/每年/每月/每周 
# - date: "yyyy-MM-dd" | "*-MM-dd" | "*-*-dd" | "Monday" | "Tuesday" | "Wednesday" | "Thursday" | "Friday" | "Saturday" | "Sunday" 
# - repeat: 是否允许重复 
# - repeat_time: 重复次数 (仅 repeat=true 时有效) 
######################################################### 
special_dates: 
  - date: "2025-01-01" # 指定某一天 
    message: "Happy New Year!" 
    actions: 
      - "[ITEM] apple 64" 

  - date: "*-01-01" # 每年的 1 月 1 日 
    message: "Happy New Year!" 
    repeat: true 
    repeat_time: 2 

  - date: "*-*-14" # 每月的 14 日 
    message: "Happy 14th" 
    repeat: false 

  - date: "Thursday" 
    message: "Crazy Thursday!" 
    repeat: true 
    repeat_time: 6 

######################################################### 
# Web API 配置 
# - 提供外部查询接口 (是否签到 / 总天数 / 连续签到等) 
# - 必须配置至少 24 个字符的 Bearer API Key
# - 建议仅监听本机并通过 HTTPS 反向代理对外提供
# - enable_web_api: 是否启用 Web API 
# - web_api_address: 监听地址 
# - web_api_port: 端口 
# - web_api_endpoint: 接口前缀

######################################################### 
web_api: 
  enable_web_api: false
  web_api_address: 127.0.0.1
  web_api_port: 7999 
  web_api_endpoint: /api
  api_key: ""
  requests_per_minute: 60
